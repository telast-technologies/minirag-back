[project]
name = "minirag-backend"
version = "0.1.0"
description = "minirag Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.38.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pydantic-core==2.46.4",
    "pydantic-ai==2.47.0",
    "sqlmodel==0.0.47",
    "aiofiles==23.2.1",
    "sqlalchemy==2.0.45",
    "alembic==1.17.2",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.2",
    "psycopg2-binary==2.9.11",
    "sqlalchemy-json==0.7.0",
    "firebase-admin==6.6.0",
    "pyjwt==2.10.1",
    "pwdlib[argon2]==0.3.0",
    "cryptography==50.0.0",
    "itsdangerous==2.2.0",
    "pillow==12.0.0",
    "requests==2.32.5",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.20",
    "email-validator==2.3.0",
    "fastapi-mail==1.6.8",
    "fastapi-pagination==0.16.0",
    "sqladmin==0.22.0",
    "slowapi==0.1.9",
    "watchfiles==0.24.0",
    "boto3>=1.35.0",
    "groq>=0.11.0",
    "celery==5.6.3",
    "redis==8.0.1",
    "kombu==5.6.0",
    "billiard==4.2.1",
    "vine==5.1.0",
    "flower==2.0.1",
    "fastapi-storages==0.5.0",
    "phonenumbers==9.0.33",
    "pydantic-extra-types==2.11.1",
    "fastapi-filter==3.0.0",
    "langchain==0.1.20",
    "PyMuPDF==1.24.3",
    "beautifulsoup4==4.15.0",
    "unstructured==0.27.8",
    "openai==3.8.0",
    "cohere==5.5.8",
    "qdrant-client==1.10.1",
    "pgvector==0.4.0",
    "nltk==3.9.1",
    "prometheus-client==0.21.1",
    "starlette-exporter==0.23.0",
    "fastapi-health==0.4.0",
]

[dependency-groups]
dev = [
    "ipython",
    "httpx",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "aiosqlite",
    "factory-boy",
    "asgi-lifespan",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "-q",
  "--import-mode=importlib",
]

[tool.coverage.run]
include = [
    "src/**/*.py",
]
omit = [
    "tests/*",
]

# ==== black ====
[tool.black]
line-length = 119
target-version = ["py311"]

# ==== isort ====
[tool.isort]
profile = "black"
line_length = 130
known_first_party = ["nutrition", "config"]
skip = [".venv/"]

[tool.pylint.FORMAT]
max-line-length = 130

[tool.pylint."MESSAGES CONTROL"]
disable = ["missing-docstring", "invalid-name"]

[tool.pylint.DESIGN]
max-parents = 13

[tool.pylint.TYPECHECK]
generated-members = [
  "REQUEST",
  "acl_users",
  "aq_parent",
  "[a-zA-Z]+_set{1,2}",
  "save",
  "delete",
]

[tool.semantic_release]
version_variables = ["pyproject.toml:version"]
assets = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "angular"
logging_use_named_masks = false
major_on_zero = true
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
